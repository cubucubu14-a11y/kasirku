name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias kasirku \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kasirku123 \
            -keypass kasirku123 \
            -dname "CN=Kasirku, OU=Dev, O=Kasirku, L=City, ST=State, C=ID"

      - name: Convert to Base64
        run: |
          base64 -w 0 release-key.jks > keystore-base64.txt
          
          echo "### ⬇️ COPY TEKS DI BAWAH INI ⬇️" >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat keystore-base64.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Keystore File
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: release-key.jks
          retention-days: 7
