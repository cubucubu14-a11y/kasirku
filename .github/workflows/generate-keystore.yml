name: Convert Keystore to Base64

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Convert to Base64
        run: |
          if [ ! -f "release-key.txt" ]; then
            echo "File release-key.txt tidak ditemukan!"
            exit 1
          fi
          base64 -w 0 release-key.txt > keystore-base64.txt
          echo "File berhasil diubah." >> $GITHUB_STEP_SUMMARY

      - name: Upload Base64 File
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64-file
          path: keystore-base64.txt
          retention-days: 1
