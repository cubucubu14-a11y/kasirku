name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Flutter project
        run: |
          flutter create --org com.kasirku --project-name kasirku temp_app
          cp -r temp_app/android .
          cp -r temp_app/pubspec.yaml .
          rm -rf temp_app

      - name: Override main.dart dengan Hello World
        run: |
          mkdir -p lib
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Kasirku',
                theme: ThemeData(primarySwatch: Colors.blue),
                home: const Scaffold(
                  body: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(Icons.store, size: 80, color: Colors.blue),
                        SizedBox(height: 20),
                        Text(
                          'Kasirku',
                          style: TextStyle(
                            fontSize: 32,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        SizedBox(height: 10),
                        Text(
                          'Hello World - Build Test',
                          style: TextStyle(fontSize: 16, color: Colors.grey),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/kasirku-v0.0.1-test.apk

      - name: Upload APK ke Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasirku-apk-test
          path: build/app/outputs/flutter-apk/kasirku-v0.0.1-test.apk
          retention-days: 30

      - name: Buat Release otomatis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1-test
          name: "Kasirku v0.0.1 - Hello World Test"
          body: "Build test pertama. APK Hello World untuk memastikan alur GitHub Actions jalan."
          files: build/app/outputs/flutter-apk/kasirku-v0.0.1-test.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
