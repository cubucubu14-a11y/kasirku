name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Flutter project
        run: |
          flutter create --org com.kasirku --project-name kasirku temp_app
          cp -r temp_app/android .
          cp -r temp_app/pubspec.yaml .
          rm -rf temp_app

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/kasirku.jks

      - name: Buat key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=kasirku123
          keyPassword=kasirku123
          keyAlias=kasirku
          storeFile=kasirku.jks
          EOF

      - name: Konfigurasi Signing Gradle
        run: |
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }

          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.kasirku.kasirku"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_1_8
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId = "com.kasirku.kasirku"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutterVersionCode.toInteger()
                  versionName = flutterVersionName
              }

              signingConfigs {
                  release {
                      keyAlias = keystoreProperties['keyAlias']
                      keyPassword = keystoreProperties['keyPassword']
                      storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword = keystoreProperties['storePassword']
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.release
                  }
              }
          }

          flutter {
              source = '../..'
          }

          dependencies {}
          EOF

      - name: Override main.dart dengan Hello World
        run: |
          mkdir -p lib
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Kasirku',
                theme: ThemeData(primarySwatch: Colors.blue),
                home: const Scaffold(
                  body: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(Icons.store, size: 80, color: Colors.blue),
                        SizedBox(height: 20),
                        Text(
                          'Kasirku',
                          style: TextStyle(
                            fontSize: 32,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        SizedBox(height: 10),
                        Text(
                          'Update Berhasil!',
                          style: TextStyle(fontSize: 16, color: Colors.grey),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (Signed)
        run: flutter build apk --release --no-shrink

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/kasirku-v0.0.3-test.apk

      - name: Upload APK ke Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasirku-apk-signed
          path: build/app/outputs/flutter-apk/kasirku-v0.0.3-test.apk
          retention-days: 30

      - name: Buat Release otomatis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.3-test
          name: "Kasirku v0.0.3 - Update Test"
          body: "Build test ketiga. Uji coba fitur update tanpa uninstall."
          files: build/app/outputs/flutter-apk/kasirku-v0.0.3-test.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
