name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Flutter project
        run: |
          flutter create --org com.kasirku --project-name kasirku temp_app
          cp -r temp_app/android .
          cp -r temp_app/pubspec.yaml .
          rm -rf temp_app

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/kasirku.jks

      - name: Buat key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=kasirku123
          keyPassword=kasirku123
          keyAlias=kasirku
          storeFile=kasirku.jks
          EOF

      - name: Konfigurasi Signing Gradle
        run: |
          # Tambahkan konfigurasi keystore ke build.gradle
          sed -i '/def flutterVersionName/a \
          def keystoreProperties = new Properties()\
          def keystorePropertiesFile = rootProject.file('"'"'key.properties'"'"')\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
          }' android/app/build.gradle

          # Tambahkan signingConfigs dan ganti buildTypes
          sed -i '/android {/a \
              signingConfigs {\
                  release {\
                      keyAlias keystoreProperties['"'"'keyAlias'"'"']\
                      keyPassword keystoreProperties['"'"'keyPassword'"'"']\
                      storeFile keystoreProperties['"'"'storeFile'"'"'] ? file(keystoreProperties['"'"'storeFile'"'"']) : null\
                      storePassword keystoreProperties['"'"'storePassword'"'"']\
                  }\
              }' android/app/build.gradle

          sed -i '/buildTypes {/,/}/c\
              buildTypes {\
                  release {\
                      signingConfig signingConfigs.release\
                  }\
              }' android/app/build.gradle

      - name: Override main.dart dengan Hello World
        run: |
          mkdir -p lib
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Kasirku',
                theme: ThemeData(primarySwatch: Colors.blue),
                home: const Scaffold(
                  body: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(Icons.store, size: 80, color: Colors.blue),
                        SizedBox(height: 20),
                        Text(
                          'Kasirku',
                          style: TextStyle(
                            fontSize: 32,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        SizedBox(height: 10),
                        Text(
                          'Signed Build Test',
                          style: TextStyle(fontSize: 16, color: Colors.grey),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (Signed)
        run: flutter build apk --release --no-shrink

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/kasirku-v0.0.2-signed.apk

      - name: Upload APK ke Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasirku-apk-signed
          path: build/app/outputs/flutter-apk/kasirku-v0.0.2-signed.apk
          retention-days: 30

      - name: Buat Release otomatis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.2-signed
          name: "Kasirku v0.0.2 - Signed Test"
          body: "Build test kedua. APK sudah ditandatangani dengan keystore asli. Update tanpa uninstall siap diuji."
          files: build/app/outputs/flutter-apk/kasirku-v0.0.2-signed.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
