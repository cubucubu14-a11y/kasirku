name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Generate Flutter project (Android folder)
        run: |
          flutter create --org com.kasirku --project-name kasirku temp_app
          cp -r temp_app/android .
          rm -rf temp_app

      - name: Inject All Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.BLUETOOTH"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' android/app/src/main/AndroidManifest.xml

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/kasirku.jks

      - name: Buat key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=kasirku123
          keyPassword=kasirku123
          keyAlias=kasirku
          storeFile=kasirku.jks
          EOF

      - name: Konfigurasi Signing Gradle
        run: |
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }

          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.kasirku.kasirku"
              compileSdk = flutter.compileSdkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_1_8
              }

              defaultConfig {
                  applicationId = "com.kasirku.kasirku"
                  minSdk = 21
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutterVersionCode.toInteger()
                  versionName = flutterVersionName
              }

              signingConfigs {
                  release {
                      keyAlias = keystoreProperties['keyAlias']
                      keyPassword = keystoreProperties['keyPassword']
                      storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword = keystoreProperties['storePassword']
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.release
                  }
              }
          }

          flutter {
              source = '../..'
          }

          dependencies {}
          EOF

      - name: Flutter pub get
        run: flutter pub get

      # --- REVISI: TAMBAHKAN STEP INI UNTUK GENERATE IKON ---
      - name: Generate App Icon
        run: dart run flutter_launcher_icons
      # ------------------------------------------------------

      - name: Patch flutter_bluetooth_serial
        run: |
          F=$(find $HOME/.pub-cache -path "*flutter_bluetooth_serial-*/android/build.gradle" | head -1)
          if [ -z "$F" ]; then
            echo "Plugin flutter_bluetooth_serial tidak ditemukan di pub-cache"
            exit 1
          fi
          echo "Patching $F"

          # 1. Tambahkan namespace (wajib di AGP 8+)
          if ! grep -q "namespace" "$F"; then
            sed -i '0,/^android {/s//android {\n    namespace "io.github.edufolly.flutterbluetoothserial"/' "$F"
          fi

          # 2. Naikkan compileSdk (mengatasi error lStar not found)
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/' "$F"

          # 3. jcenter sudah mati, ganti ke mavenCentral
          sed -i 's/jcenter()/mavenCentral()/g' "$F"

          # 4. Hapus atribut package di manifest plugin (ditolak AGP 8)
          M="$(dirname "$F")/src/main/AndroidManifest.xml"
          sed -i 's/ package="[^"]*"//' "$M"

          echo "----- build.gradle hasil patch -----"
          cat "$F"
          echo "----- AndroidManifest hasil patch -----"
          cat "$M"

      - name: Build APK (Signed)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/kasirku-v5.0.0-final.apk

      - name: Upload APK ke Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasirku-apk-final
          path: build/app/outputs/flutter-apk/kasirku-v5.0.0-final.apk
          retention-days: 30

      - name: Buat Release otomatis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0-final
          name: "Kasirku v5.0.0 - Full Release"
          body: "Rilis lengkap: Pembayaran Tunai/Kris, Kembalian, Cetak Printer, PIN Toko, Galeri Produk, dan Filter Riwayat."
          files: build/app/outputs/flutter-apk/kasirku-v5.0.0-final.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
